services:
  postgres:
    image: postgres:15-alpine
    container_name: meeting-vote-postgres
    environment:
      POSTGRES_DB: meeting-vote
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meeting-vote"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: