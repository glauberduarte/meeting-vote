validator:
  cpf:
    url: https://api.cpfhub.io/cpf/
    header: x-api-key

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/meeting-vote
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG